name: Runner test
on: workflow_dispatch

jobs:
  test:
    runs-on: [self-hosted, nso]
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Who am I
        run: |
          echo "Job ${{ matrix.job }} is running on: $RUNNER_NAME"
          uname -m
          sw_vers -productVersion
      - name: Hold the runner for a minute
        run: sleep 60
