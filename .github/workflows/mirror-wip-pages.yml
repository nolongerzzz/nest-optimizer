# Mirrors the claude-wip branch to a separate repository that serves it as a
# GitHub Pages preview site.
#
# Why a second repository: GitHub Pages builds exactly one site per repository,
# from one publishing source. It cannot serve `main` and `claude-wip` at two
# URLs from this repo, so the preview lives in its own repo with its own site.
#
# Setup (one time, see docs/PREVIEW-SITE.md) requires PREVIEW_REPO to exist and
# the WIP_PAGES_TOKEN secret to be set. This never touches `main`.
name: Mirror claude-wip to preview site

on:
  push:
    branches: [claude-wip]
  workflow_dispatch:

concurrency:
  group: mirror-wip-pages
  cancel-in-progress: true

env:
  PREVIEW_REPO: nest-wip

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out claude-wip
        uses: actions/checkout@v4
        with:
          ref: claude-wip
          fetch-depth: 1

      - name: Assemble the preview tree
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/site"
          rm -rf "$SITE"
          # The publishable site goes in dist/, and pages.yml uploads only that
          # directory - not the whole repository.
          mkdir -p "$SITE/dist"
          # Only tracked files, so nothing untracked or ignored can leak out.
          git archive --format=tar HEAD | tar -x -C "$SITE/dist"
          cd "$SITE/dist"
          # Not part of the site: CI config, the Node/Python test harness, the
          # docs (the app only mentions them in comments), editor and repo
          # housekeeping.
          rm -rf .github .claude tools docs
          rm -f package.json package-lock.json ARCHITECTURE_AUDIT.md .gitignore .claude-wip-ping
          # fixtures/ is mostly test data (24 MB). The app fetches exactly these
          # at run time - app-print.js (template + frozen planner data) and
          # nso-3mf.js (TEMPLATE_DIR) - so keep them and nothing else. If the
          # app starts fetching another fixture, add it here.
          KEEP="$RUNNER_TEMP/keep-fixtures"
          rm -rf "$KEEP"
          mkdir -p "$KEEP/supports"
          mv fixtures/bambu-templates "$KEEP/bambu-templates"
          mv fixtures/print-planner "$KEEP/print-planner"
          mv fixtures/supports/simple_overhang_p1s.gcode.3mf "$KEEP/supports/"
          rm -rf fixtures
          mkdir fixtures
          mv "$KEEP"/* fixtures/
          # What Pages needs from the artifact (and rejects if it is wrong).
          test -f index.html || { echo "::error::dist/index.html is missing"; exit 1; }
          for f in fixtures/supports/simple_overhang_p1s.gcode.3mf fixtures/print-planner fixtures/bambu-templates; do
            test -e "$f" || { echo "::error::$f is missing from dist"; exit 1; }
          done
          if [ -n "$(find . -type l)" ]; then echo "::error::dist contains symbolic links"; find . -type l; exit 1; fi
          if [ -n "$(find . -type f -links +1)" ]; then echo "::error::dist contains hard links"; find . -type f -links +1; exit 1; fi
          echo "dist: $(find . -type f | wc -l) files, $(du -sh . | cut -f1)"
          cd "$SITE"
          mkdir -p .github/workflows
          cp "$GITHUB_WORKSPACE/.github/preview-site/pages.yml" .github/workflows/pages.yml
          sed "s|@SOURCE_SHA@|${GITHUB_SHA}|g; s|@SOURCE_REPO@|${GITHUB_REPOSITORY}|g" \
            "$GITHUB_WORKSPACE/.github/preview-site/README.md" > README.md

      - name: Push to the preview repository
        env:
          WIP_PAGES_TOKEN: ${{ secrets.WIP_PAGES_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "${WIP_PAGES_TOKEN}" ]; then
            echo "::error::WIP_PAGES_TOKEN is not set. See docs/PREVIEW-SITE.md for the one-time setup."
            exit 1
          fi
          cd "$RUNNER_TEMP/site"
          git init -q -b main
          git config user.name "nest-optimizer preview bot"
          git config user.email "noreply@github.com"
          git add -A
          git commit -q -m "Preview of claude-wip @ ${GITHUB_SHA:0:7}"
          # Force push: the preview repo is a disposable snapshot, not history.
          git push -q --force \
            "https://x-access-token:${WIP_PAGES_TOKEN}@github.com/${OWNER}/${PREVIEW_REPO}.git" main
          echo "Mirrored to https://github.com/${OWNER}/${PREVIEW_REPO}"
          echo "Site will be live at https://${OWNER}.github.io/${PREVIEW_REPO}/"
