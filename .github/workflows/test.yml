# The repo's test suite, run on every push to claude-wip and every PR into main.
#
# Intended to become a REQUIRED status check on main (Settings -> Branches ->
# branch protection -> "Require status checks to pass before merging"). The
# check name to select there is "npm test", from the job name below.
#
# Why this runs `npm test` as one step rather than enumerating the suites:
# package.json's "test" script IS the combined entry point, and chaining the
# suites here in YAML instead would let the two drift - a sixth suite added to
# package.json would silently not run in CI. Running the same command a
# contributor runs locally is the whole point. As of this commit that is:
#
#   cth:unit       tools/cth-test/run-all.sh          117 checks, pure Node
#   cth:capture    capture-check.mjs                   27 checks, headless Chromium
#   cth:drive      drive-check.mjs                     14 checks, Chromium + real WASM CSG
#   3mf:roundtrip  3mf-test/roundtrip-check.js         56 checks, pure Node
#   3mf:drive      3mf-test/export-drive-check.mjs     39 checks, headless Chromium
#
# Deliberately NOT here, matching docs/HANDOFF.md: `npm run grispr:test` (Python,
# unwired) and the tools/nso_wire_*.js / repair / sculpt / fuse suites, none of
# which are in `npm test`. Adding them is a package.json decision, not a CI one -
# make the change there and this workflow picks it up for free.
#
# No network is needed by the tests themselves. index.html names three.js and the
# manifold CSG kernel on cdn.jsdelivr.net; tools/cth-test/browser-lib.mjs answers
# those requests from vendor/manifold/ and the `three` devDependency instead, and
# drive-check.mjs asserts that substitution actually happened. A run that somehow
# reached the real CDN would fail, not silently pass.
name: Tests

on:
  push:
    branches: [claude-wip, ci-selftest-negative]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per branch / PR. A superseded run is cancelled rather than left to
# burn a runner, but note a cancelled run reads as "not passing" to branch
# protection until the newer one finishes - that is intended.
concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser checks call chromium.launch() with no executablePath unless
      # CHROME_PATH is set, so Playwright must resolve its OWN pinned build. This
      # installs exactly the revision playwright@<locked version> expects, which
      # is why CHROME_PATH - needed in the Claude web sandbox, where the shipped
      # Chromium predates the installed Playwright - is not needed here.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: "PROBE (throwaway): can this runner reach the CDN directly?"
        continue-on-error: true
        run: |
          echo "--- cdn.jsdelivr.net reachability from a GitHub Actions runner ---"
          for u in \
            "https://cdn.jsdelivr.net/npm/manifold-3d@3.5.3/manifold.js" \
            "https://cdn.jsdelivr.net/npm/manifold-3d@3.5.3/manifold.wasm" \
            "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"; do
            code=$(curl -sS -o /tmp/probe.out -w '%{http_code}' -m 20 "$u" 2>/tmp/probe.err || echo "ERR")
            echo "  $code  $(wc -c </tmp/probe.out 2>/dev/null || echo 0) bytes  $u"
            [ "$code" = "ERR" ] && echo "       curl: $(cat /tmp/probe.err)"
          done
          echo "--- vendored copies actually in the repo ---"
          ls -l vendor/manifold/

      - name: Run the suite
        run: npm test
