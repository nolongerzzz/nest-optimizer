# The repo's test suite, run on pull requests into main and on pushes to the
# working branches.
#
# This is the REQUIRED status check on main (Settings -> Branches -> branch
# protection -> "Require status checks to pass before merging"). The check name
# is "npm test", from the job name below.
#
# WHY THIS FILE HAS TO LIVE ON main
# For a `pull_request` event, GitHub reads workflow definitions from the PR's
# MERGE REF - base merged with head. A workflow that exists only on a side branch
# is invisible to PRs targeting main: no run is queued, nothing ever reports, and
# a required check sits on "Expected - waiting for status to be reported"
# forever, blocking every merge. That is not a syntax or permissions problem and
# it produces no error anywhere; it just silently does nothing. Keep this file on
# main. A branch may carry a newer copy, but main must always have one.
#
# WHAT IT RUNS
# The suite, in six parallel shards, through tools/run-tests.mjs. The suite
# list deliberately is NOT repeated here - package.json's "testSteps" is the
# single definition, and a copy in this file would drift from it. Add a suite
# there and CI picks it up with no change to this workflow: the runner packs it
# into a shard on its own.
#
# WHY SIX, AND WHY A PACKED SPLIT
# Measured, not guessed. The 104 steps are 697s of work locally and the shape
# is lopsided: defects:test alone is 15% of it, the ten slowest are 46%, and 27
# steps together are under 2%. Slicing the list into six equal-LENGTH pieces
# would leave one runner holding defects:test and another holding the tail, so
# the slowest shard - the only number CI waits on - would hardly move. The
# runner packs by measured cost instead (package.json "testStepWeights"),
# which lands all six shards at 116s.
#
# Six because that is where the gain stops. Four shards is ~5.9 min of runner
# time, six is ~3.9, eight is ~3.5 - past six the longest single step
# (defects:test, 104s) is the floor, and buying a seventh runner to save 24
# seconds is not worth the queue time. If this ever needs to go lower, split
# defects:test rather than adding shards.
#
# THE REQUIRED CHECK IS THE "npm test" JOB BELOW, NOT THE SHARDS
# Branch protection on main requires a check called "npm test". A bare matrix
# would report as "shard 1 of 6", "shard 2 of 6" and so on, and the required
# check would never report at all - the same silent forever-pending failure
# this file warns about above. So the shards do the work and a final job named
# "npm test" gates on all of them. Renaming that job breaks main's protection;
# adding or removing shards does not.
#
# Note the suite is not the same on every branch: main's `test` script is
# narrower than the working branches'. That is fine - the check name is stable,
# so branch protection keeps working while the suite grows.
#
# THE LIBRARY'S PIECES ARE IN A SECOND REPO, AND IT IS CHECKED OUT HERE
# The catalog's STLs live in nolongerzzz/nest-library; this repo's library/
# keeps only the fixtures checks load by name. The checks about the catalog
# itself - every row has a file, the generators' output is byte-identical to
# the shipped piece, every category really loads - read a nest-library
# checkout through tools/nso_library_dir.js and SKIP, out loud, without one.
# A SKIP is not a pass, and CI is the one place that must never be quietly
# skipping them, so every shard checks nest-library out beside the suite and
# points NSO_LIBRARY_DIR at it. It is main that is checked out, because main
# is what the page's raw.githubusercontent.com base serves: the comparison
# is against what users actually load.
#
# THE TESTS NEED NO NETWORK
# index.html names three.js and the manifold CSG kernel on cdn.jsdelivr.net;
# tools/cth-test/browser-lib.mjs answers those requests from vendor/manifold/ and
# the `three` devDependency instead. A runner does have outbound access - all
# three CDN URLs return 200, measured - but the hermetic path is the tested path,
# so a CDN outage cannot redden the build.
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, claude-wip]
  workflow_dispatch:

# One run per branch / PR. A superseded run is cancelled rather than left to burn
# a runner. Note a cancelled run reads as "not passing" to branch protection
# until the newer one finishes - that is intended.
concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: shard ${{ matrix.shard }} of 6
    runs-on: ubuntu-latest
    # A shard is ~4 minutes of runner time; this is room for a slow runner and
    # for the suite to grow before the split needs revisiting.
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NSO_LIBRARY_DIR: ${{ github.workspace }}/nest-library
    strategy:
      # Every shard reports. One shard failing must not cancel the other five -
      # that would put back exactly the blindness the failure-tolerant runner
      # was written to remove.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Check out
        uses: actions/checkout@v5

      # After the main checkout, never before: that one cleans the workspace.
      # nest-library is public, so the job's own token reads it.
      - name: Check out nest-library
        uses: actions/checkout@v5
        with:
          repository: nolongerzzz/nest-library
          ref: main
          path: nest-library

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser checks call chromium.launch() with no executablePath unless
      # CHROME_PATH is set, so Playwright must resolve its OWN pinned build. This
      # fetches exactly the revision the locked Playwright wants, which is why
      # CHROME_PATH - needed in the Claude web sandbox, where the shipped
      # Chromium predates the installed Playwright - is not needed or set here.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run this shard
        run: node tools/run-tests.mjs --shard=${{ matrix.shard }}/6

  # The required status check. Named "npm test" because that is the name main's
  # branch protection asks for; it gates on the shards and runs no tests itself.
  # if: always() so that it REPORTS a failure when a shard fails, rather than
  # being skipped - a skipped required check blocks a PR just as hard as a
  # failing one, and says less about why.
  test:
    name: npm test
    runs-on: ubuntu-latest
    needs: shard
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Every shard passed
        run: |
          echo "shards: ${{ needs.shard.result }}"
          if [ "${{ needs.shard.result }}" != "success" ]; then
            echo "at least one shard did not pass - open the shard jobs above for the failing steps"
            exit 1
          fi
