<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nest Optimizer – Smart Plate Packing for 3D Printing</title>
  <link rel="stylesheet" href="styles.css?v=corners8" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/STLLoader.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">
        <span class="logo-icon">⬡</span>
        <div>
          <h1>Nest Optimizer</h1>
          <p class="tagline">Max models • Minimal supports • Any plate</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-clear" class="btn btn-ghost">Clear</button>
      </div>
    </header>
    <main>
      <aside class="panel left-panel">
        <section class="card card-compact">
          <h2>Plate</h2>
          <select id="plate-select">
            <option value="a1mini">A1 Mini 180</option>
            <option value="a1">A1 / P1S / X1C 256</option>
            <option value="prusa">Prusa 250 × 210</option>
            <option value="ender">Ender 220</option>
            <option value="custom">Custom…</option>
          </select>
          <div id="custom-size" class="custom-size hidden">
            <label>W <input type="number" id="custom-w" value="180" min="50" max="500"></label>
            <label>D <input type="number" id="custom-d" value="180" min="50" max="500"></label>
          </div>
          <div class="plate-info hidden-quiet">
            <span id="plate-dims">180 × 180 mm</span>
            <span id="plate-area">32,400 mm²</span>
          </div>
        </section>
        <section class="card card-compact">
          <h2>Library</h2>
          <input type="file" id="file-input" accept=".stl" multiple class="hidden-quiet" />
          <div id="model-list" class="model-list"></div>
          <div class="edit-row" style="margin-top:8px;align-items:center;gap:8px;flex-wrap:wrap;">
            <label for="clone-count">Clone</label>
            <input id="clone-count" type="number" min="1" max="20" value="1" style="width:4rem;" />
            <button id="btn-clone" class="btn btn-secondary" type="button" disabled>Clone piece</button>
          </div>
        </section>
        <section class="card card-compact" id="edit-card">
          <h2>Cut</h2>
          <div class="edit-row tool-toggle-row">
            <button id="btn-cutter-open" class="btn btn-secondary" type="button">Open</button>
            <button id="btn-cutter-close" class="btn btn-secondary" type="button" disabled>Close</button>
          </div>
          <p id="cutter-status" class="hint hidden-quiet">Cutter closed</p>
          <p id="edit-size" class="hint hidden-quiet">—</p>
          <div id="cutter-tools" class="cutter-tools">
            <div class="edit-row">
              <button id="btn-cut-axis-x" class="btn btn-secondary" type="button">Cut X</button>
              <button id="btn-cut-axis-z" class="btn btn-secondary" type="button">Cut Z</button>
            </div>
            <select id="edit-axis" class="hidden-quiet"><option value="auto">Longest axis</option><option value="x">X</option><option value="z">Z</option></select>
            <div class="edit-row">
              <button id="btn-yaw-left-90" class="btn btn-secondary" type="button">⟲ 90</button>
              <button id="btn-yaw-left" class="btn btn-secondary" type="button">⟲ 15</button>
              <button id="btn-yaw-right" class="btn btn-secondary" type="button">15 ⟳</button>
              <button id="btn-yaw-right-90" class="btn btn-secondary" type="button">90 ⟳</button>
            </div>
            <input type="range" id="cut-slider" min="2" max="98" step="0.1" value="50" />
            <div class="edit-row cut-mm-row">
              <button id="btn-cut-nudge-m" class="btn btn-secondary" type="button">−1</button>
              <input type="number" id="cut-mm" value="50" min="0.5" max="400" step="0.1" />
              <button id="btn-cut-nudge-p" class="btn btn-secondary" type="button">+1</button>
            </div>
            <p id="cut-readout" class="cut-readout">—</p>
            <button id="btn-cut" class="btn btn-cut" type="button">Split</button>
          </div>
        </section>
        <section class="card" id="join-card">
          <h2>Join</h2>
          <button id="btn-join-start" class="btn btn-secondary" type="button">Start Join</button>
          <div class="join-slots">
            <button type="button" class="join-slot" id="join-slot-a" data-slot="a"><span class="join-badge join-badge-a">A</span><span class="join-slot-name" id="join-name-a">Pick piece A</span></button>
            <button type="button" class="join-slot" id="join-slot-b" data-slot="b"><span class="join-badge join-badge-b">B</span><span class="join-slot-name" id="join-name-b">Pick piece B</span></button>
          </div>
          <button id="btn-join-align" class="btn btn-secondary" type="button">Align edges</button>
          <button id="btn-join-cx" class="btn btn-secondary" type="button">Center X</button>
          <button id="btn-join-cz" class="btn btn-secondary" type="button">Center Z</button>
          <button id="btn-join" class="btn btn-primary" type="button" disabled>Complete Join</button>
          <button id="btn-subtract" class="btn btn-secondary" type="button">Subtract B from A</button>
          <button id="btn-extract-bit" class="btn btn-secondary" type="button">Extract bit</button>
          <button id="btn-seat-flush" class="btn btn-secondary" type="button">Seat flush</button>
          <button id="btn-flip-port" class="btn btn-secondary" type="button">Flip port</button>
          <button id="btn-cap-open" class="btn btn-secondary" type="button">Cap open faces</button>
          <button id="btn-join-clear" class="btn btn-ghost" type="button">Cancel Join</button>
        </section>
        <section class="card card-compact" id="export-card">
          <h2>Export</h2>
          <button id="btn-export-model" class="btn btn-primary" type="button">Download selected STL</button>
          <button id="btn-export-stl" class="btn btn-secondary" type="button" disabled>Export plate</button>
          <button id="btn-delete-model" class="btn btn-secondary" type="button">Delete model</button>
        </section>
        <section class="card card-compact">
          <h2>Pack</h2>
          <button id="btn-optimize" class="btn btn-primary" disabled>Optimize plate</button>
        </section>
      </aside>
      <section class="viewport-section">
        <div id="viewport"></div>
        <div class="viewport-overlay viewport-overlay-topbar">
          <button id="btn-load-stl" class="vp-bar-btn" type="button">＋ Load</button>
          <button id="btn-delete-placed" class="vp-bar-btn" type="button">⌫ Remove</button>
          <button id="btn-rot-left" class="vp-bar-btn adjust-btn" disabled>⟲ 90°</button>
          <button id="btn-rot-right" class="vp-bar-btn adjust-btn" disabled>90° ⟳</button>
          <button id="btn-flip" class="vp-bar-btn adjust-btn" disabled>Edge</button>
          <button id="btn-tip" class="vp-bar-btn adjust-btn" disabled>Tip</button>
          <button id="btn-roll" class="vp-bar-btn adjust-btn" disabled>Flat</button>
          <button id="btn-tilt-up" class="vp-bar-btn adjust-btn" disabled>Pitch +</button>
          <button id="btn-tilt-dn" class="vp-bar-btn adjust-btn" disabled>Pitch −</button>
          <button id="btn-bank-up" class="vp-bar-btn adjust-btn" disabled>Bank +</button>
          <button id="btn-bank-dn" class="vp-bar-btn adjust-btn" disabled>Bank −</button>
          <button id="btn-raise" class="vp-bar-btn adjust-btn" disabled>Raise</button>
          <button id="btn-lower" class="vp-bar-btn adjust-btn" disabled>Lower</button>
          <button id="btn-nudge-fwd" class="vp-bar-btn adjust-btn" disabled>↑</button>
          <button id="btn-nudge-back" class="vp-bar-btn adjust-btn" disabled>↓</button>
          <button id="btn-nudge-left" class="vp-bar-btn adjust-btn" disabled>←</button>
          <button id="btn-nudge-right" class="vp-bar-btn adjust-btn" disabled>→</button>
        </div>
        <div class="viewport-overlay viewport-overlay-finish">
          <details class="vp-menu vp-finish-menu">
            <summary>Finish</summary>
            <div class="vp-menu-body vp-finish">
              <div class="vp-row">
                <label class="vp-clone">R <input type="number" id="inp-soften-r" value="0.5" min="0.05" max="5" step="0.05"></label>
                <button id="btn-soften" class="btn btn-secondary" type="button">Soften</button>
              </div>
              <div class="vp-row">
                <select id="sel-edge-treat" class="vp-select">
                  <option value="fillet" selected>Round</option>
                  <option value="corners">Corners</option>
                  <option value="chamfer">Bevel</option>
                </select>
              </div>
              <div class="vp-row">
                <label class="vp-repair"><span>Repair</span><input type="checkbox" id="chk-seal-repair"></label>
                <button id="btn-seal" class="btn btn-secondary" type="button">Seal</button>
              </div>
              <div class="vp-row"><button id="btn-solidify" class="btn btn-secondary" type="button">Solidify</button></div>
              <div class="vp-row">
                <input type="number" id="inp-thicken-mm" value="1.5" min="0.4" max="8" step="0.1">
                <button id="btn-thicken-out" class="btn btn-secondary" type="button">Thicken out</button>
              </div>
              <div class="vp-row">
                <input type="number" id="inp-thicken-in" value="1.5" min="0.4" max="8" step="0.1">
                <button id="btn-thicken-in" class="btn btn-secondary" type="button">Thicken in</button>
              </div>
              <div class="vp-row"><button id="btn-clear-plate" class="btn btn-secondary" type="button">Clear plate</button></div>
            </div>
          </details>
        </div>
        <div class="viewport-overlay viewport-overlay-bl">
          <button id="btn-undo" class="viewport-tool-btn" type="button" disabled>↶</button>
          <button id="btn-frame-view" class="viewport-tool-btn" type="button">◎</button>
          <button id="btn-xray" class="viewport-tool-btn" type="button">X</button>
        </div>
        <div class="viewport-overlay viewport-overlay-br">
          <p id="adjust-status" class="status-hud status-hud-id">HUD corners8</p>
          <p id="status" class="status status-hud"></p>
        </div>
      </section>
    </main>
  </div>
  <div id="ctx-menu" class="ctx-menu hidden" role="menu">
    <button type="button" id="ctx-export" class="ctx-item" role="menuitem">Export STL</button>
    <button type="button" id="ctx-delete" class="ctx-item ctx-danger" role="menuitem">Delete piece</button>
  </div>
  <script src="app-core.js?v=corners8"></script>
  <script src="app-cut.js?v=corners8"></script>
  <script src="app-finish.js?v=corners8"></script>
  <script src="app-sel-outline.js?v=corners8"></script>
  <script src="app-join.js?v=corners8"></script>
  <script src="app-ux.js?v=corners8"></script>
</body>
</html>
