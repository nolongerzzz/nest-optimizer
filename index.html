<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nest Optimizer – Smart Plate Packing for 3D Printing</title>
  <link rel="stylesheet" href="styles.css?v=inside6" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/STLLoader.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">
        <span class="logo-icon">⬡</span>
        <div>
          <h1>Nest Optimizer</h1>
          <p class="tagline">Max models • Minimal supports • Any plate</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-clear" class="btn btn-ghost">Clear</button>
      </div>
    </header>
    <main>
      <aside class="panel left-panel">
        <section class="card card-compact">
          <h2>Plate</h2>
          <select id="plate-select">
            <option value="a1mini">A1 Mini 180</option>
            <option value="a1">A1 / P1S / X1C 256</option>
            <option value="prusa">Prusa 250 × 210</option>
            <option value="ender">Ender 220</option>
            <option value="custom">Custom…</option>
          </select>
          <div id="custom-size" class="custom-size hidden">
            <label>W <input type="number" id="custom-w" value="180" min="50" max="500"></label>
            <label>D <input type="number" id="custom-d" value="180" min="50" max="500"></label>
          </div>
          <div class="plate-info hidden-quiet">
            <span id="plate-dims">180 × 180 mm</span>
            <span id="plate-area">32,400 mm²</span>
          </div>
        </section>
        <section class="card card-compact">
          <h2>Library</h2>
          <input type="file" id="file-input" accept=".stl,.3mf" multiple class="hidden-quiet" />
          <div id="model-list" class="model-list"></div>
          <div class="edit-row" style="margin-top:8px;align-items:center;gap:8px;flex-wrap:wrap;">
            <label for="clone-count">Clone</label>
            <input id="clone-count" type="number" min="1" max="20" value="1" style="width:4rem;" />
            <button id="btn-clone" class="btn btn-secondary" type="button" disabled>Clone piece</button>
          </div>
        </section>
        <section class="card card-compact" id="scale-card">
          <h2>Size</h2>
          <p id="scale-readout" class="hint">Select a piece to resize.</p>
          <div class="edit-row" style="align-items:center;gap:6px;flex-wrap:wrap;">
            <label for="scale-axis">Set</label>
            <select id="scale-axis" title="Which dimension the target applies to">
              <option value="longest">Longest edge</option>
              <option value="x">X</option>
              <option value="y">Height</option>
              <option value="z">Z</option>
            </select>
            <input id="scale-target" type="number" min="0.1" max="1000" step="0.1" value="50" style="width:5rem;" aria-label="Target size in mm" />
            <span class="hint">mm</span>
            <button id="btn-scale-dim" class="btn btn-secondary" type="button"
                    title="Solve the factor that makes the chosen dimension exactly this many mm, and apply it to all three axes.">Set size</button>
          </div>
          <div class="edit-row" style="align-items:center;gap:6px;flex-wrap:wrap;">
            <label for="scale-factor">Scale by</label>
            <input id="scale-factor" type="number" min="0.0001" max="10000" step="0.01" value="1" style="width:5rem;" aria-label="Scale factor" />
            <span class="hint">&times;</span>
            <button id="btn-scale-factor" class="btn btn-secondary" type="button"
                    title="Plain uniform multiplier on all three axes.">Scale</button>
          </div>
        </section>
        <section class="card card-compact" id="edit-card">
          <h2>Cut</h2>
          <div class="edit-row tool-toggle-row">
            <button id="btn-cutter-open" class="btn btn-secondary" type="button">Open</button>
            <button id="btn-cutter-close" class="btn btn-secondary" type="button" disabled>Close</button>
          </div>
          <p id="cutter-status" class="hint hidden-quiet">Cutter closed</p>
          <p id="edit-size" class="hint hidden-quiet">—</p>
          <div id="cutter-tools" class="cutter-tools">
            <div class="edit-row">
              <button id="btn-cut-axis-x" class="btn btn-secondary" type="button">Cut X</button>
              <button id="btn-cut-axis-z" class="btn btn-secondary" type="button">Cut Z</button>
            </div>
            <select id="edit-axis" class="hidden-quiet"><option value="auto">Longest axis</option><option value="x">X</option><option value="z">Z</option></select>
            <div class="edit-row">
              <button id="btn-yaw-left-90" class="btn btn-secondary" type="button">⟲ 90</button>
              <button id="btn-yaw-left" class="btn btn-secondary" type="button">⟲ 15</button>
              <button id="btn-yaw-right" class="btn btn-secondary" type="button">15 ⟳</button>
              <button id="btn-yaw-right-90" class="btn btn-secondary" type="button">90 ⟳</button>
            </div>
            <input type="range" id="cut-slider" min="2" max="98" step="0.1" value="50" />
            <div class="edit-row cut-mm-row">
              <button id="btn-cut-nudge-m" class="btn btn-secondary" type="button">−1</button>
              <input type="number" id="cut-mm" value="50" min="0.5" max="400" step="0.1" />
              <button id="btn-cut-nudge-p" class="btn btn-secondary" type="button">+1</button>
            </div>
            <p id="cut-readout" class="cut-readout">—</p>
            <button id="btn-cut" class="btn btn-cut" type="button">Split</button>
          </div>
        </section>
        <section class="card" id="join-card">
          <h2>Join</h2>
          <button id="btn-join-start" class="btn btn-secondary" type="button">Start Join</button>
          <div class="join-slots">
            <button type="button" class="join-slot" id="join-slot-a" data-slot="a"><span class="join-badge join-badge-a">A</span><span class="join-slot-name" id="join-name-a">Pick piece A</span></button>
            <button type="button" class="join-slot" id="join-slot-b" data-slot="b"><span class="join-badge join-badge-b">B</span><span class="join-slot-name" id="join-name-b">Pick piece B</span></button>
          </div>
          <button id="btn-join-align" class="btn btn-secondary" type="button">Align edges</button>
          <button id="btn-join-cx" class="btn btn-secondary" type="button">Center X</button>
          <button id="btn-join-cz" class="btn btn-secondary" type="button">Center Z</button>
          <button id="btn-join" class="btn btn-primary" type="button" disabled>Complete Join</button>
          <button id="btn-subtract" class="btn btn-secondary" type="button">Subtract B from A</button>
          <button id="btn-extract-bit" class="btn btn-secondary" type="button">Extract bit</button>
          <button id="btn-seat-flush" class="btn btn-secondary" type="button" title="Flush plug seat: bury B in A with its outer face 0.01 mm proud of A's skin, then Subtract. Ignores the gap slider.">Seat flush</button>
          <div class="seat-support">
            <button id="btn-seat-support" class="btn btn-secondary" type="button" title="Seat B's mating face at the slider's gap off A's skin (or off the skin tips of a skinned face). Negative = air gap, easy release is -0.15 to -0.20. Positive = B overlaps into A. 0 = touching.">Seat (support)</button>
            <div class="seat-support-row">
              <input type="range" id="seat-gap" min="-0.25" max="0.05" step="0.01" value="-0.18" title="Seat gap in mm, 0.01 steps. -0.25 (air) to +0.05 (overlap); default -0.18, mid easy-release. Arrow keys step 0.01." aria-label="Seat gap in mm" />
              <output id="seat-gap-value" for="seat-gap" title="Exact gap the next Seat (support) will use">-0.18 mm</output>
            </div>
          </div>
          <button id="btn-flip-port" class="btn btn-secondary" type="button">Flip port</button>
          <button id="btn-join-clear" class="btn btn-ghost" type="button">Cancel Join</button>
        </section>
        <section class="card card-compact" id="export-card">
          <h2>Export</h2>
          <label class="hint" for="export-format" style="margin-bottom:4px;display:block">Format</label>
          <select id="export-format" title="File format for both export buttons">
            <option value="stl">STL</option>
            <option value="3mf">3MF - Bambu Studio project, cooling settings baked in</option>
          </select>
          <div id="cooling-profile-row" hidden>
            <label class="hint" for="cooling-profile" style="margin-bottom:4px;display:block">Cooling profile</label>
            <select id="cooling-profile" title="Cooling / overhang-fan settings baked into the 3MF"></select>
            <p class="hint" id="cooling-profile-note"></p>
          </div>
          <button id="btn-export-model" class="btn btn-primary" type="button">Download selected STL</button>
          <button id="btn-export-stl" class="btn btn-secondary" type="button" disabled>Export plate STL</button>
          <button id="btn-delete-model" class="btn btn-secondary" type="button">Delete model</button>
        </section>
        <section class="card card-compact">
          <h2>Pack</h2>
          <button id="btn-optimize" class="btn btn-primary" disabled>Optimize plate</button>
        </section>
      </aside>
      <section class="viewport-section">
        <div id="viewport"></div>
        <div class="viewport-overlay viewport-overlay-topbar">
          <button id="btn-load-stl" class="vp-bar-btn" type="button">＋ Load</button>
          <div class="vp-library">
            <button id="btn-library" class="vp-bar-btn" type="button"
                    aria-haspopup="true" aria-expanded="false"
                    title="Load a piece from this project's library">Library</button>
            <div id="library-list" class="library-list" role="menu" hidden
                 style="display:none"></div>
          </div>
          <button id="btn-delete-placed" class="vp-bar-btn" type="button">⌫ Remove</button>
          <button id="btn-rot-left" class="vp-bar-btn adjust-btn" disabled>⟲ 90°</button>
          <button id="btn-rot-right" class="vp-bar-btn adjust-btn" disabled>90° ⟳</button>
          <button id="btn-flip" class="vp-bar-btn adjust-btn" disabled>Edge</button>
          <button id="btn-tip" class="vp-bar-btn adjust-btn" disabled>Tip</button>
          <button id="btn-roll" class="vp-bar-btn adjust-btn" disabled>Flat</button>
          <button id="btn-tilt-up" class="vp-bar-btn adjust-btn" disabled>Pitch +</button>
          <button id="btn-tilt-dn" class="vp-bar-btn adjust-btn" disabled>Pitch −</button>
          <button id="btn-bank-up" class="vp-bar-btn adjust-btn" disabled>Bank +</button>
          <button id="btn-bank-dn" class="vp-bar-btn adjust-btn" disabled>Bank −</button>
          <button id="btn-raise" class="vp-bar-btn adjust-btn" disabled>Raise</button>
          <button id="btn-lower" class="vp-bar-btn adjust-btn" disabled>Lower</button>
          <button id="btn-nudge-fwd" class="vp-bar-btn adjust-btn" disabled>↑</button>
          <button id="btn-nudge-back" class="vp-bar-btn adjust-btn" disabled>↓</button>
          <button id="btn-nudge-left" class="vp-bar-btn adjust-btn" disabled>←</button>
          <button id="btn-nudge-right" class="vp-bar-btn adjust-btn" disabled>→</button>
          <button id="btn-lock-pos" class="vp-bar-btn btn-lock-pos" type="button" disabled aria-pressed="false" title="Lock the selected piece's position. A locked piece refuses drag, the nudge arrows, Raise/Lower and the pose buttons, so a stray click cannot move it. Seat, Center, Align and Skin still place it. Shown by a teal outline and a 'locked' tag.">🔒 Lock position</button>
          <button id="btn-plate-lock" class="vp-bar-btn btn-plate-lock" type="button" disabled aria-pressed="false" title="Lock the plate configuration: hold every piece where it is, in their current relative positions, in one action. Separate from the per-piece lock - it sets no piece flag, so unlocking the plate gives back exactly the piece locks you had.">🔒 Lock plate</button>
        </div>
        <div class="viewport-overlay viewport-overlay-finish">
          <details class="vp-menu vp-finish-menu">
            <summary>Finish</summary>
            <div class="vp-menu-body vp-finish">
              <div class="vp-row vp-row-opts">
                <label class="vp-clone">R <input type="number" id="inp-soften-r" value="0.5" min="0.05" max="5" step="0.05"></label>
                <label class="vp-clone" title="On: one click wraps all six faces of a box. Off: one click bakes only the face you pick."><input type="checkbox" id="chk-full-wrap" checked> Full wrap</label>
              </div>
              <div class="vp-row vp-row-full"><button id="btn-soften" class="btn btn-secondary" type="button">Soften</button></div>
              <div class="vp-row vp-row-full">
                <select id="sel-edge-treat" class="vp-select">
                  <option value="fillet" selected>Round</option>
                  <option value="corners">Corners</option>
                  <option value="cornersedges">Corners+edges</option>
                  <option value="chamfer">Bevel</option>
                </select>
              </div>
              <div class="vp-row vp-row-full">
                <button id="btn-smooth" class="btn btn-secondary" type="button"
                        title="Global Laplacian smoothing over the whole piece. No feature preservation - sharp edges round off too. Refuses if volume moves more than 25% either way, or if any face is painted.">Smooth</button>
              </div>
              <div class="vp-row vp-row-triple vp-row-paint">
                <button id="btn-mask-select" class="btn btn-secondary btn-paint btn-paint-select" type="button" aria-pressed="false"
                        title="Click ONE face to make it the target (pink). Skin face uses it instead of its own pick. A click on another face moves the target; a click on the target clears it. Click this button again to stop.">Paint Selected</button>
                <button id="btn-mask-paint" class="btn btn-secondary btn-paint" type="button" aria-pressed="false"
                        title="Click faces to exclude them (yellow) from Soften, wrap, Join and Skin. Click a face again to include it. Click this button again to stop.">Paint Excluded</button>
                <button id="btn-mask-clear" class="btn btn-secondary" type="button"
                        title="Include every face again and drop the target.">Clear paint</button>
              </div>
              <div class="vp-row vp-row-skin vp-row-delete">
                <button id="btn-mask-delete" class="btn btn-danger" type="button"
                        title="Remove the target face's geometry from the piece (pink, from Paint Selected). Not an exclude - the triangles are gone. Refuses and leaves the piece untouched if the cut would empty it, split it into loose bodies, or self-intersect. Stands down if the target is also painted excluded.">Delete painted</button>
                <select id="sel-mask-delete" class="vp-select" title="Face: cut the face out and leave the rim open. Face+seal: cut it out and let Repair close the rim, reverting the whole delete if it cannot. Shell: cut out the whole body that face belongs to." aria-label="Delete mode">
                  <option value="face" selected>Face</option>
                  <option value="face-seal">Face+seal</option>
                  <option value="shell">Shell</option>
                </select>
              </div>
              <div class="vp-row vp-row-skin">
                <button id="btn-skin-face" class="btn btn-secondary" type="button" title="Put a contact skin on the selected piece's target face (pink, from Paint Selected). With no target: on piece A's flat face that looks at B in a Join, or its top face outside one. A relief whose tips are all B touches; then Seat with gap 0 to rest B on the tips. Refuses a non-rectangular face; stands down if that face is painted excluded.">Skin face</button>
                <select id="skin-pattern" class="vp-select" title="Skin pattern. crosshatch: fine rib lattice (0.42 mm ribs, 1.2 mm pitch, 0.6 tall). zigzag: sawtooth ridges (0.42 mm crests, 2 mm pitch). ring: one tapered ring (r 5, wall 0.8 to 0.4, 1 mm tall)." aria-label="Skin pattern">
                  <option value="crosshatch">crosshatch</option>
                  <option value="zigzag">zigzag</option>
                  <option value="ring">ring</option>
                </select>
              </div>
              <div class="vp-row vp-row-skin vp-row-skin2">
                <button id="btn-skin-wrap" class="btn btn-secondary" type="button" title="Put the same skin on EVERY flat rectangular face of the piece at once - all six faces of a box. Faces painted excluded are left alone and named; a face that is not a rectangle is skipped and named. Not a curved wrap: a cylinder's side is still refused.">Skin wrap</button>
                <label class="vp-repair vp-skin-free" title="Layer 2 as its own free-hanging shell: a sheet resting on layer 1's tips with its own relief on top. The piece then carries two shells, so this sets the Non-solid flag on it. Undo takes the flag off with the geometry. The sheet bridges from tip to tip when it prints.">
                  <span>Free</span><input type="checkbox" id="chk-skin-free">
                </label>
                <select id="skin-layer2" class="vp-select" title="Second skin layer, the row's own: off means one layer. composed (Free off): layer 2 rides on layer 1's tips in one closed shell - zigzag crests cut the contact hardest, a crosshatch mostly just makes the relief taller, and the status reports both numbers. With Free on: layer 2 becomes its own free-hanging sheet resting on the tips, a second breakaway interface, and the piece is flagged non-solid." aria-label="Skin layer 2 pattern">
                  <option value="off">off</option>
                  <option value="zigzag">zigzag</option>
                  <option value="crosshatch">crosshatch</option>
                  <option value="ring">ring</option>
                </select>
              </div>
              <div class="vp-row vp-row-skin">
                <button id="btn-skin-patch" class="btn btn-secondary" type="button" title="Bake the skin pattern as its own printable piece instead of onto a face - the relief alone, like a washer you can test on its own. Adds a NEW piece (30 x 30 mm, the same footprint the skin samples use) and leaves every existing piece untouched. bordered: the pattern inside a solid 1.2 mm rim standing 0.6 mm proud of its tips, one closed shell. loose: the pattern's features alone, solid, no rim and no backing plate - a free-standing one-extrusion-line lattice, so this one is flagged Non-solid.">Skin patch</button>
                <select id="skin-patch-variant" class="vp-select" title="Which standalone patch. bordered: a washer - the pattern held inside a solid rim that takes the handling, self-contained and closed. loose: the raw pattern only, no frame and no backing plate, with ties where the pattern's own features do not touch each other (the zigzag's ridges). Both are real walls, never an infinitely thin surface." aria-label="Skin patch variant">
                  <option value="bordered">bordered</option>
                  <option value="loose">loose</option>
                </select>
              </div>
              <div class="vp-row vp-row-carve">
                <button id="btn-carve" class="btn btn-secondary btn-carve" type="button" aria-pressed="false"
                        title="Local carving tool. Arm it, then click a face, an edge or a corner of a piece: the blade is aimed along the outward bisector of whatever faces it can reach there, and just that local volume is subtracted. A corner gouge and an edge chamfer need no rotation - the blade lays its sweep axis along the edge itself. Click Carve again to stop. Unlike Subtract this consumes nothing, so the same blade carves the next edge too.">Carve</button>
                <select id="carve-blade" class="vp-select" aria-label="Blade profile"
                        title="Blade profile. flat: a slab, leaves a flat-bottomed local shave. ball: a hemisphere-ended cylinder, leaves a rounded gouge with no stress corner. vee: a wedge, leaves a V-groove or a chamfer - cut deeper for a wider one.">
                  <option value="ball">ball-nose</option>
                  <option value="flat">flat shave</option>
                  <option value="vee">V-groove</option>
                </select>
              </div>
              <div class="vp-row vp-row-carve2">
                <label class="vp-clone" title="How deep the blade goes, along the outward bisector of the faces it meets."><span id="carve-depth-label">mm</span> <input type="number" id="carve-depth" value="1" min="0.1" max="30" step="0.1"></label>
                <label class="vp-clone"><span id="carve-a-label">R</span> <input type="number" id="carve-a" value="2" min="0.1" max="30" step="0.1"></label>
                <label class="vp-clone"><span id="carve-b-label">L</span> <input type="number" id="carve-b" value="10" min="0.2" max="60" step="0.1"></label>
                <label class="vp-clone" title="Spin the blade about the outward direction. 0 lays its sweep axis along the edge, which is what a chamfer wants."><span id="carve-roll-label">&deg;</span> <input type="number" id="carve-roll" value="0" min="-180" max="180" step="5"></label>
              </div>
              <div class="vp-row vp-row-full"><p id="carve-readout" class="carve-readout">&mdash;</p></div>
              <div class="vp-row vp-row-full">
                <button id="btn-cap-open" class="btn btn-secondary" type="button" title="Close every open boundary loop of the selected piece with a flat cap.">Cap open faces</button>
              </div>
              <div class="vp-row vp-row-full">
                <label class="vp-flag vp-flag-repair" title="A flag, not an action: it changes what the next Seal click does. On, Seal runs the full repair pass - weld, drop degenerate and duplicate triangles, split pinches, fix T-junctions, peel flaps and fan holes shut. Off, Seal only closes openings.">
                  <input type="checkbox" id="chk-seal-repair"><span class="vp-flag-face">Repair</span>
                </label>
              </div>
              <div class="vp-row vp-row-full">
                <button id="btn-seal" class="btn btn-secondary" type="button">Seal</button>
              </div>
              <div class="vp-row vp-row-full vp-row-sep">
                <label class="vp-flag vp-flag-nonsolid" title="This piece is meant to be open - a vase-mode shell, a single-wall squishy, a woven sheet. Only the 'must be closed' checks stand aside: self-intersection, degenerate and winding checks still apply. Per piece, never guessed from the mesh.">
                  <input type="checkbox" id="chk-non-solid" disabled><span class="vp-flag-face">Non-solid</span>
                </label>
              </div>
              <div class="vp-row vp-row-pair">
                <button id="btn-measure" class="btn btn-secondary btn-measure" type="button" aria-pressed="false"
                        title="Click two points on the pieces to read the distance between them in mm, or switch to Edge and click one edge for its length. Corners and edges snap. Measuring changes nothing on the piece. Click this button again to stop; Esc clears the measurement.">Measure</button>
                <select id="sel-measure-mode" class="vp-select" title="What a measure click means. Two points: click twice, get the distance. Edge: click once near an edge, get that edge's whole length." aria-label="Measure mode">
                  <option value="span" selected>Two points</option>
                  <option value="edge">Edge</option>
                </select>
              </div>
              <div class="vp-row vp-row-full">
                <button id="btn-check-defects" class="btn btn-secondary btn-check-defects" type="button" disabled aria-pressed="false"
                        title="Run the canonical checker on this piece and paint what it finds ON the mesh: red lines on open edges, orange on non-manifold edges, red patches on the triangles of every piercing pair, violet on faces whose wall or gap measures under 0.42 mm. A snapshot, not a live check - it clears itself when a bake changes the piece.">Check piece</button>
              </div>
              <div class="vp-row vp-row-full"><button id="btn-solidify" class="btn btn-secondary" type="button">Solidify</button></div>
              <div class="vp-row vp-row-thicken">
                <button id="btn-thicken-out" class="btn btn-secondary" type="button">Thicken out</button>
                <div class="thick-spin">
                  <input type="number" id="inp-thicken-mm" value="1.5" min="0.4" max="8" step="0.1" aria-label="Thicken mm">
                  <div class="thick-spin-arrows">
                    <button type="button" class="thick-arrow" data-thick-step="-1" aria-label="Less mm" title="Less">&#9662;</button>
                    <button type="button" class="thick-arrow" data-thick-step="1" aria-label="More mm" title="More">&#9652;</button>
                  </div>
                </div>
                <button id="btn-thicken-in" class="btn btn-secondary" type="button">Thicken in</button>
              </div>
              <div class="vp-row vp-row-full"><button id="btn-clear-plate" class="btn btn-secondary" type="button">Clear plate</button>
            </div>
          </details>
        </div>
        <div class="viewport-overlay viewport-overlay-bl">
          <button id="btn-undo" class="viewport-tool-btn" type="button" disabled>↶</button>
          <button id="btn-frame-view" class="viewport-tool-btn" type="button">◎</button>
          <button id="btn-xray" class="viewport-tool-btn" type="button">X</button>
        </div>
        <div class="viewport-overlay viewport-overlay-br">
          <p id="adjust-status" class="status-hud status-hud-id">HUD inside6</p>
          <p id="status" class="status status-hud"></p>
        </div>
      </section>
    </main>
  </div>
